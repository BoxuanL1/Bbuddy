name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[browser,documents,test]"
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python scripts/build_plugin.py
      - run: python scripts/audit_public_release.py .
      - run: git diff --exit-code -- plugins/bbuddy
